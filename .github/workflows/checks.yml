name: Blender add-on checks

on:
  push:
    branches: ['**']
    tags: ['helix-tools-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blender-5-2-2:
    runs-on: ubuntu-24.04
    env:
      BLENDER_USER_RESOURCES: ${{ github.workspace }}/.blender-test-user
      BLENDER_USER_CONFIG: ${{ github.workspace }}/.blender-test-user/config
      BLENDER_USER_SCRIPTS: ${{ github.workspace }}/.blender-test-user/scripts
      BLENDER_USER_DATAFILES: ${{ github.workspace }}/.blender-test-user/datafiles
      BLENDER_USER_EXTENSIONS: ${{ github.workspace }}/.blender-test-user/extensions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact Blender Python API
        run: |
          python -m pip install --only-binary=:all: -r requirements-test.txt
      - name: Run behavioral regressions
        run: |
          mkdir -p "$BLENDER_USER_CONFIG" "$BLENDER_USER_SCRIPTS" "$BLENDER_USER_DATAFILES" "$BLENDER_USER_EXTENSIONS"
          python tests/run_tests.py --report test-results/blender.json
      - name: Build extension archives
        run: python scripts/build_releases.py
      - name: Validate extension manifests and archive layout
        run: python scripts/validate_releases.py
      - name: Check clean release installation
        run: python scripts/check_release_install.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helix-tools-blender-5.2.2
          path: |
            dist/
            test-results/

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/helix-tools-v')
    needs: blender-5-2-2
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: helix-tools-blender-5.2.2
          path: release-build
      - name: Prepare verified release downloads
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/prepare_release.py --dist release-build/dist --output release-assets --tag "$RELEASE_TAG"
      - name: Publish stable and versioned downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/*.zip release-assets/SHA256SUMS release-assets/releases.json \
            --verify-tag --title "Helix Tools ${RELEASE_TAG#helix-tools-v}" --notes-file release-assets/RELEASE_NOTES.md
